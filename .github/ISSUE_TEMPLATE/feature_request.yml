name: Feature request
description: Suggest an improvement to PageArc
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Data, network, or localization impact
      description: Explain any local data, backup, WebDAV, update, accessibility, or translation implications.
