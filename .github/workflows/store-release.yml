name: Microsoft Store Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Discover, inspect, cancel, or submit the validated package
        required: true
        type: choice
        options:
          - discover
          - status
          - cancel
          - submit
        default: discover
      product_id:
        description: Partner Center product ID returned by discovery (required for submit)
        required: false
        type: string
      confirmation:
        description: Enter SUBMIT to commit, or DELETE-<submission ID> to cancel
        required: false
        type: string
      submission_id:
        description: Exact audited pending submission ID (required for cancel)
        required: false
        type: string
  push:
    branches:
      - publish/v1.3-one-shot

permissions:
  contents: read

concurrency:
  group: pagearc-store-release
  cancel-in-progress: false

jobs:
  partner-center:
    runs-on: windows-2025-vs2026
    timeout-minutes: 75
    env:
      STORE_PRODUCT_ID: ${{ github.event_name == 'push' && '9NTHMP210H9B' || inputs.product_id }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        if: github.event_name == 'push' || inputs.mode == 'submit'
        with:
          dotnet-version: 10.0.x

      - name: Set up Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Authenticate to Partner Center
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msstore reconfigure `
            --tenantId '${{ secrets.AZURE_AD_TENANT_ID }}' `
            --sellerId '${{ secrets.SELLER_ID }}' `
            --clientId '${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}' `
            --clientSecret '${{ secrets.AZURE_AD_APPLICATION_SECRET }}'
          if ($LASTEXITCODE -ne 0) { throw "Partner Center authentication failed: $LASTEXITCODE" }

      - name: List Partner Center applications
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discover'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msstore apps list
          if ($LASTEXITCODE -ne 0) { throw "Could not list Partner Center applications: $LASTEXITCODE" }

      - name: Inspect current Partner Center submission
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'status'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:STORE_PRODUCT_ID)) { throw 'Status inspection requires a Partner Center product ID.' }
          msstore submission status $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "Could not read Store submission status: $LASTEXITCODE" }
          msstore submission get $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "Could not read Store submission details: $LASTEXITCODE" }

      - name: Cancel audited Partner Center submission
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cancel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedId = '${{ inputs.submission_id }}'
          if ([string]::IsNullOrWhiteSpace($expectedId) -or '${{ inputs.confirmation }}' -cne "DELETE-$expectedId") { throw 'Cancellation requires confirmation=DELETE-<exact audited submission ID>.' }
          if ($env:STORE_PRODUCT_ID -cne '9NTHMP210H9B') { throw 'Cancellation is restricted to the PageArc product.' }
          $details = msstore submission get $env:STORE_PRODUCT_ID | Out-String
          if ($LASTEXITCODE -ne 0 -or $details -notmatch ('"Id"\s*:\s*"' + [regex]::Escape($expectedId) + '"')) { throw "Pending submission changed; expected $expectedId." }
          msstore submission delete $env:STORE_PRODUCT_ID --no-confirm
          if ($LASTEXITCODE -ne 0) { throw "Could not cancel the audited Store submission: $LASTEXITCODE" }
          msstore submission status $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "Could not verify Store submission cancellation: $LASTEXITCODE" }

      - name: Validate submission authorization
        if: github.event_name == 'push' || inputs.mode == 'submit'
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            if ('${{ github.ref }}' -cne 'refs/heads/publish/v1.3-one-shot') { throw 'Automatic Store publication is restricted to the one-shot v1.3 release branch.' }
            if ($env:STORE_PRODUCT_ID -cne '9NTHMP210H9B') { throw 'Automatic Store publication resolved an unexpected product ID.' }
          }
          else {
            if ('${{ inputs.confirmation }}' -cne 'SUBMIT') { throw 'Store submission requires confirmation=SUBMIT.' }
            if ([string]::IsNullOrWhiteSpace($env:STORE_PRODUCT_ID)) { throw 'Store submission requires a Partner Center product ID.' }
          }

      - name: Test and build Microsoft Store package
        if: github.event_name == 'push' || inputs.mode == 'submit'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$manifest = Get-Content -Raw Package.Store.appxmanifest
          if ($manifest.Package.Identity.Name -cne 'JoKiy.PageArc') { throw "Store identity mismatch: $($manifest.Package.Identity.Name)" }
          if ($manifest.Package.Identity.Version -ne '2026.904.130.0') { throw "Store version mismatch: $($manifest.Package.Identity.Version)" }
          $source = Join-Path $env:RUNNER_TEMP 'calibre-9.13.0.tar.xz'
          .\eng\prepare-calibre-runtime.ps1 -Version '9.13.0' -DownloadSource -SourceDestination $source
          $converter = Resolve-Path 'ThirdParty\calibre\runtime\ebook-convert.exe'
          & $converter --version
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $source) -or (Get-Item $source).Length -lt 1MB) { throw 'Pinned calibre runtime/source preparation failed.' }
          dotnet restore PageArc.slnx -p:Configuration=Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/PageArc.Tests/PageArc.Tests.csproj -c Release -p:Platform=x64 --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\Packaging\Build-StorePackage.ps1 -Configuration Release -Platform x64 -OutputDirectory artifacts\store-package-v1.3-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $upload = Get-ChildItem artifacts\store-package-v1.3-release -Filter '*.msixupload' -File | Select-Object -First 1
          if (-not $upload) { throw 'The Store MSIX upload package was not generated.' }
          if ($upload.Length -lt 250MB) { throw "Store upload package is unexpectedly small and may be missing calibre: $($upload.Length) bytes" }
          "STORE_UPLOAD=$($upload.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload validated Store candidate
        if: github.event_name == 'push' || inputs.mode == 'submit'
        uses: actions/upload-artifact@v4
        with:
          name: PageArc-v1.3-Microsoft-Store
          path: artifacts/store-package-v1.3-release
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Submit package for Microsoft certification
        if: github.event_name == 'push' || inputs.mode == 'submit'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishRoot = Join-Path $env:RUNNER_TEMP 'pagearc-store-publish'
          $publishLeaf = Join-Path $publishRoot 'candidate'
          New-Item -ItemType Directory -Path $publishLeaf -Force | Out-Null
          Copy-Item -LiteralPath $env:STORE_UPLOAD -Destination $publishLeaf
          msstore publish "$env:GITHUB_WORKSPACE" `
            --inputDirectory "$publishRoot" `
            --appId $env:STORE_PRODUCT_ID `
            --uploadTimeout 1800 `
            --verbose
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store submission failed: $LASTEXITCODE" }

      - name: Read submission status
        if: github.event_name == 'push' || inputs.mode == 'submit'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msstore submission status $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "Could not read Store submission status: $LASTEXITCODE" }
