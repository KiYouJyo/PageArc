name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PageArc.slnx

      - name: Test
        run: dotnet test tests/PageArc.Tests/PageArc.Tests.csproj -c Debug -p:Platform=x64 --no-restore

      - name: Build Debug x64
        run: dotnet build PageArc.csproj -c Debug -p:Platform=x64 --no-restore

      - name: Build Release x64
        run: dotnet build PageArc.csproj -c Release -p:Platform=x64 --no-restore

      - name: Whitespace check
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
