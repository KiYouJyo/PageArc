name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem -Path . -Recurse -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host ("PowerShell syntax error(s) in {0}" -f $_.FullName) -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }
      - name: Restore
        run: dotnet restore PageArc.slnx

      - name: Test
        run: dotnet test tests/PageArc.Tests/PageArc.Tests.csproj -c Debug -p:Platform=x64 --no-restore

      - name: Build Debug x64
        shell: pwsh
        run: |
          dotnet build PageArc.csproj -c Debug -p:Platform=x64 --no-restore 2>&1 | Tee-Object -FilePath build-debug.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release x64
        shell: pwsh
        run: |
          dotnet build PageArc.csproj -c Release -p:Platform=x64 --no-restore 2>&1 | Tee-Object -FilePath build-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build-*.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Whitespace check
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
