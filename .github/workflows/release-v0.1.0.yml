name: Release v0.1.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pagearc-release-v0.1.0
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, smoke-test, and publish v0.1.0
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check whether v0.1.0 is already published
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            'exists=true' | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'v0.1.0 already exists; release build will be skipped.'
          } else {
            'exists=false' | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

      - name: Validate source
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -Raw PageArc.csproj
          $version = @($project.Project.PropertyGroup | ForEach-Object Version | Where-Object { $_ })[0]
          if ($version -ne '0.1.0') { throw "Project version mismatch: $version" }
          dotnet restore PageArc.slnx -p:Configuration=Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/PageArc.Tests/PageArc.Tests.csproj -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build PageArc.csproj -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Load configured publisher certificate
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_PASSWORD)) { throw 'Release signing secrets are missing.' }
          $root = Join-Path $env:RUNNER_TEMP 'PageArc-v0.1.0-release'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $pfx = Join-Path $root 'release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:RELEASE_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:RELEASE_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert -or -not $cert.HasPrivateKey) { throw 'Configured certificate could not be imported.' }
          if ($cert.Subject -cne 'CN=AppPublisher' -or $cert.Thumbprint -cne 'BD85AD77A651C86CA01A480C8E9BC64952993F98') { throw "Unexpected signing certificate: $($cert.Subject) / $($cert.Thumbprint)" }
          $cer = Join-Path $root 'PageArc-AppPublisher.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          "RELEASE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CERTIFICATE_PATH=$cer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare standard packaged WinUI build
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content -Raw PageArc.csproj
          $text = $text -replace '(?m)^\s*<WindowsPackageType>None</WindowsPackageType>\s*\r?\n', ''
          $text = $text -replace '(?m)^\s*<PublishProfile>.*?</PublishProfile>\s*\r?\n', ''
          $text = $text -replace '<WindowsAppSDKSelfContained>true</WindowsAppSDKSelfContained>', '<WindowsAppSDKSelfContained>false</WindowsAppSDKSelfContained>'
          Set-Content -LiteralPath PageArc.csproj -Value $text -Encoding utf8

          $assets = Join-Path (Get-Location) 'Assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Add-Type -AssemblyName System.Drawing
          function New-Logo([string]$Path, [int]$Width, [int]$Height) {
            $bmp = New-Object System.Drawing.Bitmap($Width,$Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(255,36,90,153))
            $size = [Math]::Max(12,[Math]::Floor([Math]::Min($Width,$Height)*0.32))
            $font = New-Object System.Drawing.Font('Segoe UI',$size,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
            $fmt = New-Object System.Drawing.StringFormat
            $fmt.Alignment = [System.Drawing.StringAlignment]::Center
            $fmt.LineAlignment = [System.Drawing.StringAlignment]::Center
            $g.DrawString('PA',$font,[System.Drawing.Brushes]::White,(New-Object System.Drawing.RectangleF(0,0,$Width,$Height)),$fmt)
            $bmp.Save($Path,[System.Drawing.Imaging.ImageFormat]::Png)
            $fmt.Dispose(); $font.Dispose(); $g.Dispose(); $bmp.Dispose()
          }
          New-Logo (Join-Path $assets 'Square44x44Logo.png') 44 44
          New-Logo (Join-Path $assets 'Square150x150Logo.png') 150 150
          New-Logo (Join-Path $assets 'Wide310x150Logo.png') 310 150
          New-Logo (Join-Path $assets 'StoreLogo.png') 50 50

          @'
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:mp="http://schemas.microsoft.com/appx/2014/phone/manifest"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"
                   IgnorableNamespaces="uap rescap">
            <Identity Name="KiYouJyo.PageArc" Publisher="CN=AppPublisher" Version="0.1.0.0" />
            <mp:PhoneIdentity PhoneProductId="2efbd068-554e-49c0-8508-0a86a7522914" PhonePublisherId="00000000-0000-0000-0000-000000000000" />
            <Properties><DisplayName>PageArc</DisplayName><PublisherDisplayName>KiYouJyo</PublisherDisplayName><Logo>Assets\StoreLogo.png</Logo></Properties>
            <Dependencies><TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.19041.0" MaxVersionTested="10.0.26100.0" /></Dependencies>
            <Resources><Resource Language="x-generate" /></Resources>
            <Applications>
              <Application Id="App" Executable="$targetnametoken$.exe" EntryPoint="$targetentrypoint$">
                <uap:VisualElements DisplayName="PageArc" Description="PageArc v0.1.0" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png">
                  <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" />
                </uap:VisualElements>
              </Application>
            </Applications>
            <Capabilities><rescap:Capability Name="runFullTrust" /></Capabilities>
          </Package>
          '@ | ForEach-Object { $_ -replace '(?m)^          ', '' } | Set-Content -LiteralPath Package.appxmanifest -Encoding utf8

      - name: Build and sign x64 MSIX
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'PageArc-AppPackages'
          dotnet restore PageArc.csproj -p:Configuration=Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Packaged restore failed: $LASTEXITCODE" }
          dotnet build PageArc.csproj -c Release -p:Platform=x64 --no-restore `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageDir="$output\"
          if ($LASTEXITCODE -ne 0) { throw "Packaged build failed: $LASTEXITCODE" }
          $built = @(Get-ChildItem $output -Recurse -Filter '*.msix' | Where-Object Name -notmatch 'Dependencies' | Sort-Object LastWriteTime -Descending) | Select-Object -First 1
          if (-not $built) { throw 'No MSIX was produced.' }
          $msix = Join-Path $env:RELEASE_ROOT 'PageArc_0.1.0.0_x64.msix'
          Copy-Item $built.FullName $msix -Force
          $kits = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $signtool = Get-ChildItem (Join-Path $kits 'Windows Kits\10\bin') -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /sha1 $env:CERT_THUMBPRINT /tr http://timestamp.digicert.com /td SHA256 $msix
          if ($LASTEXITCODE -ne 0) { throw "Signing failed: $LASTEXITCODE" }
          $sig = Get-AuthenticodeSignature $msix
          if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -cne $env:CERT_THUMBPRINT) { throw 'Signer verification failed.' }
          "MSIX_PATH=$msix" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and launch smoke test
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-ChildItem Cert:\LocalMachine\TrustedPeople -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $env:CERT_THUMBPRINT)) {
            Import-Certificate -FilePath $env:CERTIFICATE_PATH -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          }
          Get-AppxPackage -Name KiYouJyo.PageArc | Remove-AppxPackage -ErrorAction SilentlyContinue
          Add-AppxPackage -Path $env:MSIX_PATH -ForceApplicationShutdown
          $pkg = Get-AppxPackage -Name KiYouJyo.PageArc
          if (-not $pkg) { throw 'Package registration failed.' }
          $aumid = "$($pkg.PackageFamilyName)!App"
          Start-Process explorer.exe -ArgumentList "shell:AppsFolder\$aumid"
          Start-Sleep -Seconds 8
          $proc = Get-Process PageArc -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $proc) { throw 'PageArc exited during release smoke test.' }
          Write-Host "PageArc release smoke test passed. PID=$($proc.Id)"
          Stop-Process -Id $proc.Id -Force
          Remove-AppxPackage -Package $pkg.PackageFullName -ErrorAction SilentlyContinue

      - name: Build release assets
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RELEASE_ROOT 'PageArc-v0.1.0-x64'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $env:MSIX_PATH $dir
          Copy-Item $env:CERTIFICATE_PATH $dir

          @'
          $ErrorActionPreference = 'Stop'
          function IsAdmin { ([Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) }
          if (-not (IsAdmin)) { $p = Start-Process powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',"`"$PSCommandPath`"") -Verb RunAs -Wait -PassThru; exit $p.ExitCode }
          $root = Split-Path -Parent $PSCommandPath
          $cert = Join-Path $root 'PageArc-AppPublisher.cer'
          $msix = Join-Path $root 'PageArc_0.1.0.0_x64.msix'
          $c = [Security.Cryptography.X509Certificates.X509Certificate2]::new($cert)
          if (-not (Get-ChildItem Cert:\LocalMachine\TrustedPeople -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $c.Thumbprint)) { Import-Certificate $cert -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null }
          Get-AppxPackage -Name KiYouJyo.PageArc | Remove-AppxPackage -ErrorAction SilentlyContinue
          Add-AppxPackage -Path $msix -ForceApplicationShutdown
          Write-Host 'PageArc v0.1.0 installed.' -ForegroundColor Green
          '@ | ForEach-Object { $_ -replace '(?m)^          ', '' } | Set-Content (Join-Path $dir 'Install.ps1') -Encoding utf8
          Set-Content (Join-Path $dir 'Install.cmd') -Value @('@echo off','powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Install.ps1"','if errorlevel 1 pause') -Encoding ascii

          @'
          PageArc v0.1.0 — Windows x64

          Install:
          1. Extract this ZIP.
          2. Run Install.cmd.
          3. Approve the administrator prompt used to trust the AppPublisher certificate and install PageArc.

          Package: framework-dependent WinUI 3 MSIX
          Publisher: CN=AppPublisher
          Supported reading format in v0.1.0: EPUB
          '@ | ForEach-Object { $_ -replace '(?m)^          ', '' } | Set-Content (Join-Path $dir 'README.txt') -Encoding utf8

          $hashFile = Join-Path $dir 'SHA256SUMS.txt'
          Get-ChildItem $dir -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content $hashFile -Encoding ascii

          $zip = Join-Path $env:RELEASE_ROOT 'PageArc-v0.1.0-x64.zip'
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zip -Force
          Copy-Item $hashFile (Join-Path $env:RELEASE_ROOT 'SHA256SUMS.txt') -Force
          "RELEASE_ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HASH_FILE=$(Join-Path $env:RELEASE_ROOT 'SHA256SUMS.txt')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          @'
          # PageArc v0.1.0

          PageArc 的首个公开版本。

          ## 主要内容
          - WinUI 3 / Windows App SDK 原生界面，严格对齐 PAGEARC Figma 设计。
          - 自适应导航、原生 Fluent 图标，以及窗口激活时青色 / 失活时中性灰的导航状态。
          - 简体中文、日本語、English 三语与应用内原地语言切换。
          - 本地书库、分类、收藏筛选、导入文件夹与阅读进度。
          - EPUB 2 / EPUB 3 的 OPF、spine、nav / NCX 解析与原生 WinUI 阅读路径。
          - GitHub Release 更新检查。
          - 格式转换页面与任务流基础界面。

          ## 当前格式支持
          v0.1.0 的稳定阅读格式为 **EPUB**。FB2 / MOBI / AZW3 / LIT 可被书库识别，但阅读适配器与实际格式转换引擎将在后续版本提供。

          ## 安装
          Windows x64 用户推荐下载 `PageArc-v0.1.0-x64.zip`，解压后运行 `Install.cmd`。发布包使用仓库配置的 `CN=AppPublisher` 证书签名。

          ---
          First public release of PageArc. EPUB is the supported reading format in v0.1.0; additional format adapters and conversion engines are planned for later versions.
          '@ | ForEach-Object { $_ -replace '(?m)^          ', '' } | Set-Content (Join-Path $env:RELEASE_ROOT 'release-notes.md') -Encoding utf8
          "RELEASE_NOTES=$(Join-Path $env:RELEASE_ROOT 'release-notes.md')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create v0.1.0 `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'PageArc v0.1.0' `
            --notes-file $env:RELEASE_NOTES `
            $env:RELEASE_ZIP `
            $env:MSIX_PATH `
            $env:CERTIFICATE_PATH `
            $env:HASH_FILE
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed: $LASTEXITCODE" }
