name: Signed Release Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - publish/v1.4-one-shot
      - acceptance/v1.4-runtime-management-polish

permissions:
  contents: write

concurrency:
  group: pagearc-signed-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Validate light reader, detached runtime, sign, install, and smoke-test v1.4
    runs-on: windows-2025-vs2026
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate source, tests, and Release build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -Raw PageArc.csproj
          $version = @($project.Project.PropertyGroup | ForEach-Object Version | Where-Object { $_ })[0]
          if ($version -ne '1.4.0') { throw "Project version mismatch: $version" }
          [xml]$manifest = Get-Content -Raw Packaging\PageArc.Package.appxmanifest
          if ($manifest.Package.Identity.Name -cne 'KiYouJyo.PageArc') { throw "Package identity mismatch: $($manifest.Package.Identity.Name)" }
          if ($manifest.Package.Identity.Publisher -cne 'CN=AppPublisher') { throw "Package publisher mismatch: $($manifest.Package.Identity.Publisher)" }
          if ($manifest.Package.Identity.Version -ne '1.4.0.0') { throw "Package version mismatch: $($manifest.Package.Identity.Version)" }
          dotnet restore PageArc.slnx -p:Configuration=Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/PageArc.Tests/PageArc.Tests.csproj -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build PageArc.csproj -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate detached PageArc.ConversionRuntime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'PageArc-v1.4-acceptance'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://github.com/KiYouJyo/PageArc.ConversionRuntime/releases/download/v9.13.0-pagearc.1'
          $manifestPath = Join-Path $root 'runtime-manifest.json'
          $archivePath = Join-Path $root 'PageArc.ConversionRuntime-win-x64.zip'
          Invoke-WebRequest -Uri "$base/runtime-manifest.json" -OutFile $manifestPath -UseBasicParsing
          $runtime = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($runtime.packageVersion -cne '9.13.0-pagearc.1') { throw 'Detached runtime package version mismatch.' }
          if ($runtime.archiveSize -ne 282915121) { throw "Detached runtime size mismatch: $($runtime.archiveSize)" }
          if ($runtime.sha256 -cne '1d223227254d6dfacc8f5645caf3cba26434e129cf5bb65decb0a121a61b5322') { throw 'Detached runtime manifest SHA pin mismatch.' }
          Invoke-WebRequest -Uri "$base/$($runtime.archiveFileName)" -OutFile $archivePath -UseBasicParsing
          if ((Get-Item $archivePath).Length -ne $runtime.archiveSize) { throw 'Detached runtime archive length mismatch.' }
          if ((Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $runtime.sha256) { throw 'Detached runtime archive SHA mismatch.' }
          $extract = Join-Path $root 'conversion-runtime'
          Expand-Archive -Path $archivePath -DestinationPath $extract -Force
          $converter = Join-Path $extract 'runtime\ebook-convert.exe'
          & $converter --version
          if ($LASTEXITCODE -ne 0) { throw 'Detached ebook-convert runtime failed to start.' }
          "ACCEPTANCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DETACHED_CONVERTER=$converter" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Execute all 20 directed conversion pairs with detached runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $matrixRoot = Join-Path $env:RUNNER_TEMP 'PageArc-v1.4-conversion-matrix'
          Remove-Item $matrixRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $matrixRoot | Out-Null
          $seedHtml = Join-Path $matrixRoot 'seed.html'
          '<!doctype html><html><head><meta charset="utf-8"><title>PageArc v1.4 acceptance</title></head><body><h1>PageArc v1.4</h1><p>Detached conversion runtime acceptance.</p><p>日本語の本文。</p></body></html>' | Set-Content $seedHtml -Encoding utf8
          $ext = @{ EPUB='epub'; FB2='fb2'; MOBI='mobi'; AZW3='azw3'; LIT='lit' }
          $seedEpub = Join-Path $matrixRoot 'seed.epub'
          & $env:DETACHED_CONVERTER $seedHtml $seedEpub --title 'PageArc v1.4 acceptance'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $seedEpub)) { throw 'Could not create seed EPUB.' }
          foreach ($format in @('FB2','MOBI','AZW3','LIT')) {
            $output = Join-Path $matrixRoot ("seed." + $ext[$format])
            & $env:DETACHED_CONVERTER $seedEpub $output
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $output) -or (Get-Item $output).Length -eq 0) { throw "Could not create $format seed." }
          }
          $formats = @('EPUB','FB2','MOBI','AZW3','LIT')
          $completed = 0
          foreach ($input in $formats) {
            foreach ($outputFormat in $formats) {
              if ($input -eq $outputFormat) { continue }
              $source = Join-Path $matrixRoot ("seed." + $ext[$input])
              $target = Join-Path $matrixRoot ("matrix-$input-to-$outputFormat." + $ext[$outputFormat])
              & $env:DETACHED_CONVERTER $source $target
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path $target) -or (Get-Item $target).Length -eq 0) { throw "Detached conversion failed: $input -> $outputFormat" }
              $completed++
            }
          }
          if ($completed -ne 20) { throw "Expected 20 directed conversions, completed $completed." }
          Write-Host 'All 20 directed conversion pairs passed with the detached runtime.' -ForegroundColor Green

      - name: Load configured PageArc publisher certificate
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_PASSWORD)) { throw 'Release signing secrets are missing.' }
          $pfx = Join-Path $env:ACCEPTANCE_ROOT 'release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:RELEASE_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:RELEASE_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert -or -not $cert.HasPrivateKey) { throw 'Configured certificate could not be imported.' }
          if ($cert.Subject -cne 'CN=AppPublisher' -or $cert.Thumbprint -cne 'BD85AD77A651C86CA01A480C8E9BC64952993F98') { throw "Unexpected signing certificate: $($cert.Subject) / $($cert.Thumbprint)" }
          $cer = Join-Path $env:ACCEPTANCE_ROOT 'PageArc-AppPublisher.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          if (-not (Get-ChildItem Cert:\LocalMachine\TrustedPeople -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $cert.Thumbprint)) { Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null }
          Remove-Item $pfx -Force
          "CERTIFICATE_PATH=$cer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build light x64 MSIX and verify conversion runtime is absent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'PageArc-v1.4-AppPackages'
          dotnet restore PageArc.csproj -p:Configuration=Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Packaged restore failed: $LASTEXITCODE" }
          dotnet build PageArc.csproj -c Release -p:Platform=x64 --no-restore `
            -p:WindowsPackageType=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageDir="$output\"
          if ($LASTEXITCODE -ne 0) { throw "Packaged build failed: $LASTEXITCODE" }
          $built = @(Get-ChildItem $output -Recurse -Filter '*.msix' | Where-Object Name -notmatch 'Dependencies' | Sort-Object LastWriteTime -Descending) | Select-Object -First 1
          if (-not $built) { throw 'No MSIX was produced.' }
          $msix = Join-Path $env:ACCEPTANCE_ROOT 'PageArc_1.4.0.0_x64.msix'; Copy-Item $built.FullName $msix -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($msix)
          try {
            $embedded = $zip.Entries | Where-Object { $_.FullName -match 'calibre|ebook-convert\.exe' } | Select-Object -First 1
            if ($embedded) { throw "Light MSIX unexpectedly contains detached conversion runtime content: $($embedded.FullName)" }
          } finally { $zip.Dispose() }
          $size = (Get-Item $msix).Length
          Write-Host "Light PageArc MSIX size: $size bytes"
          "MSIX_PATH=$msix" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MSIX_SIZE=$size" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign, verify, install, and launch x64 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kits = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $signtool = Get-ChildItem (Join-Path $kits 'Windows Kits\10\bin') -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found.' }
          & $signtool.FullName sign /fd SHA256 /sha1 $env:CERT_THUMBPRINT /tr http://timestamp.digicert.com /td SHA256 $env:MSIX_PATH
          if ($LASTEXITCODE -ne 0) { throw "Signing failed: $LASTEXITCODE" }
          & $signtool.FullName verify /pa /v $env:MSIX_PATH
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $LASTEXITCODE" }
          $sig = Get-AuthenticodeSignature $env:MSIX_PATH
          if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -cne $env:CERT_THUMBPRINT) { throw 'Signer verification failed.' }
          $hash = (Get-FileHash $env:MSIX_PATH -Algorithm SHA256).Hash.ToLowerInvariant(); "MSIX_SHA256=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Get-AppxPackage -Name KiYouJyo.PageArc | Remove-AppxPackage -ErrorAction SilentlyContinue
          Add-AppxPackage -Path $env:MSIX_PATH -ForceApplicationShutdown
          $pkg = Get-AppxPackage -Name KiYouJyo.PageArc
          if (-not $pkg -or $pkg.Version -ne '1.4.0.0') { throw "Installed package validation failed: $($pkg.Version)" }
          Start-Process explorer.exe -ArgumentList "shell:AppsFolder\$($pkg.PackageFamilyName)!App"
          Start-Sleep -Seconds 10
          $process = Get-Process PageArc -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $process) { throw 'Packaged PageArc did not remain running after launch.' }
          Stop-Process -Id $process.Id -Force; Remove-AppxPackage -Package $pkg.PackageFullName -ErrorAction SilentlyContinue

      - name: Assemble signed installer artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:ACCEPTANCE_ROOT 'PageArc-v1.4-x64-signed-release'; New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $env:MSIX_PATH $dir; Copy-Item $env:CERTIFICATE_PATH $dir; Copy-Item THIRD_PARTY_NOTICES.md $dir
          @('PageArc v1.4 x64 signed light-reader release',"Build: $env:GITHUB_SHA","Signer: CN=AppPublisher / $env:CERT_THUMBPRINT","MSIX SHA-256: $env:MSIX_SHA256","MSIX size: $env:MSIX_SIZE bytes",'Conversion runtime is NOT bundled. PageArc downloads PageArc.ConversionRuntime 9.13.0-pagearc.1 only when needed.','Detached runtime SHA-256: 1d223227254d6dfacc8f5645caf3cba26434e129cf5bb65decb0a121a61b5322','All 20 directed EPUB/FB2/MOBI/AZW3/LIT conversion pairs passed with the detached runtime.','Validated: automated tests, Release build, no embedded calibre payload, signature verification, clean install/version check and packaged launch.') | Set-Content (Join-Path $dir 'ACCEPTANCE.txt') -Encoding utf8
          $checksums = foreach ($file in Get-ChildItem $dir -File) { "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($file.Name)" }
          $checksums | Set-Content (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii
          "ARTIFACT_DIR=$dir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload signed v1.4 release package
        uses: actions/upload-artifact@v4
        with:
          name: PageArc-v1.4-x64-signed-release
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Publish GitHub v1.4 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/publish/v1.4-one-shot'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zipPath = Join-Path $env:ACCEPTANCE_ROOT 'PageArc-v1.4-x64-signed-release.zip'
          Compress-Archive -Path (Join-Path $env:ARTIFACT_DIR '*') -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $checksums = Join-Path $env:ARTIFACT_DIR 'SHA256SUMS.txt'
          gh release view v1.4 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.4 $zipPath $env:MSIX_PATH $checksums --clobber
            gh release edit v1.4 --title 'PageArc v1.4' --notes-file docs/RELEASE-NOTES-v1.4.md --latest
          } else {
            gh release create v1.4 $zipPath $env:MSIX_PATH $checksums --target $env:GITHUB_SHA --title 'PageArc v1.4' --notes-file docs/RELEASE-NOTES-v1.4.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed: $LASTEXITCODE" }
