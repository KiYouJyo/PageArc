name: v0.9.3 Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pagearc-v0.9.3-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, sign, smoke-test, and publish v0.9.3
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate release source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -Raw PageArc.csproj
          $version = @($project.Project.PropertyGroup | ForEach-Object Version | Where-Object { $_ })[0]
          if ($version -ne '0.9.3') { throw "Project version mismatch: $version" }

          [xml]$manifest = Get-Content -Raw Packaging\PageArc.Package.appxmanifest
          if ($manifest.Package.Identity.Name -cne 'KiYouJyo.PageArc') { throw "Package identity mismatch: $($manifest.Package.Identity.Name)" }
          if ($manifest.Package.Identity.Publisher -cne 'CN=AppPublisher') { throw "Package publisher mismatch: $($manifest.Package.Identity.Publisher)" }
          if ($manifest.Package.Identity.Version -ne '0.9.3.0') { throw "Package version mismatch: $($manifest.Package.Identity.Version)" }

          dotnet restore PageArc.slnx -p:Configuration=Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/PageArc.Tests/PageArc.Tests.csproj -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build PageArc.csproj -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Load configured publisher certificate
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_PASSWORD)) {
            throw 'Release signing secrets are missing.'
          }

          $root = Join-Path $env:RUNNER_TEMP 'PageArc-v0.9.3-release'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $pfx = Join-Path $root 'release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:RELEASE_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:RELEASE_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert -or -not $cert.HasPrivateKey) { throw 'Configured certificate could not be imported.' }
          if ($cert.Subject -cne 'CN=AppPublisher' -or $cert.Thumbprint -cne 'BD85AD77A651C86CA01A480C8E9BC64952993F98') {
            throw "Unexpected signing certificate: $($cert.Subject) / $($cert.Thumbprint)"
          }

          $cer = Join-Path $root 'PageArc-AppPublisher.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          if (-not (Get-ChildItem Cert:\LocalMachine\TrustedPeople -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $cert.Thumbprint)) {
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          }
          Remove-Item $pfx -Force

          "RELEASE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CERTIFICATE_PATH=$cer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare packaged WinUI source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content -Raw PageArc.csproj
          $text = $text -replace '(?m)^\s*<WindowsPackageType>None</WindowsPackageType>\s*\r?\n', ''
          $text = $text -replace '(?m)^\s*<PublishProfile>.*?</PublishProfile>\s*\r?\n', ''
          Set-Content -LiteralPath PageArc.csproj -Value $text -Encoding utf8

          Copy-Item Packaging\PageArc.Package.appxmanifest Package.appxmanifest -Force

          $assets = Join-Path (Get-Location) 'Assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Add-Type -AssemblyName System.Drawing
          function New-Logo([string]$Path, [int]$Width, [int]$Height) {
            $bmp = New-Object System.Drawing.Bitmap($Width,$Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(255,36,90,153))
            $size = [Math]::Max(12,[Math]::Floor([Math]::Min($Width,$Height)*0.32))
            $font = New-Object System.Drawing.Font('Segoe UI',$size,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
            $fmt = New-Object System.Drawing.StringFormat
            $fmt.Alignment = [System.Drawing.StringAlignment]::Center
            $fmt.LineAlignment = [System.Drawing.StringAlignment]::Center
            $g.DrawString('PA',$font,[System.Drawing.Brushes]::White,(New-Object System.Drawing.RectangleF(0,0,$Width,$Height)),$fmt)
            $bmp.Save($Path,[System.Drawing.Imaging.ImageFormat]::Png)
            $fmt.Dispose(); $font.Dispose(); $g.Dispose(); $bmp.Dispose()
          }
          New-Logo (Join-Path $assets 'Square44x44Logo.png') 44 44
          New-Logo (Join-Path $assets 'Square150x150Logo.png') 150 150
          New-Logo (Join-Path $assets 'Wide310x150Logo.png') 310 150
          New-Logo (Join-Path $assets 'StoreLogo.png') 50 50

      - name: Build, sign, and verify release MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'PageArc-AppPackages'
          dotnet restore PageArc.csproj -p:Configuration=Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Packaged restore failed: $LASTEXITCODE" }
          dotnet build PageArc.csproj -c Release -p:Platform=x64 --no-restore `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageDir="$output\"
          if ($LASTEXITCODE -ne 0) { throw "Packaged build failed: $LASTEXITCODE" }

          $built = @(Get-ChildItem $output -Recurse -Filter '*.msix' | Where-Object Name -notmatch 'Dependencies' | Sort-Object LastWriteTime -Descending) | Select-Object -First 1
          if (-not $built) { throw 'No MSIX was produced.' }
          $msix = Join-Path $env:RELEASE_ROOT 'PageArc_0.9.3.0_x64.msix'
          Copy-Item $built.FullName $msix -Force

          $kits = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $signtool = Get-ChildItem (Join-Path $kits 'Windows Kits\10\bin') -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found.' }
          & $signtool.FullName sign /fd SHA256 /sha1 $env:CERT_THUMBPRINT /tr http://timestamp.digicert.com /td SHA256 $msix
          if ($LASTEXITCODE -ne 0) { throw "Signing failed: $LASTEXITCODE" }
          & $signtool.FullName verify /pa /v $msix
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $LASTEXITCODE" }

          $sig = Get-AuthenticodeSignature $msix
          if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -cne $env:CERT_THUMBPRINT) { throw 'Signer verification failed.' }
          $hash = (Get-FileHash $msix -Algorithm SHA256).Hash.ToLowerInvariant()
          "MSIX_PATH=$msix" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MSIX_SHA256=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and launch release smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-AppxPackage -Name KiYouJyo.PageArc | Remove-AppxPackage -ErrorAction SilentlyContinue
          Add-AppxPackage -Path $env:MSIX_PATH -ForceApplicationShutdown
          $pkg = Get-AppxPackage -Name KiYouJyo.PageArc
          if (-not $pkg) { throw 'Package registration failed.' }
          if ($pkg.Version -ne '0.9.3.0') { throw "Installed package version mismatch: $($pkg.Version)" }
          $aumid = "$($pkg.PackageFamilyName)!App"
          Start-Process explorer.exe -ArgumentList "shell:AppsFolder\$aumid"
          Start-Sleep -Seconds 8
          $process = Get-Process PageArc -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $process) { throw 'Packaged PageArc did not remain running after launch.' }
          Stop-Process -Id $process.Id -Force
          Remove-AppxPackage -Package $pkg.PackageFullName -ErrorAction SilentlyContinue

      - name: Build release assets and notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RELEASE_ROOT 'PageArc-v0.9.3-x64'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $env:MSIX_PATH $dir
          Copy-Item $env:CERTIFICATE_PATH $dir

          @'
          $ErrorActionPreference = 'Stop'
          function IsAdmin { ([Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) }
          if (-not (IsAdmin)) {
            $p = Start-Process powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',"`"$PSCommandPath`"") -Verb RunAs -Wait -PassThru
            exit $p.ExitCode
          }
          $root = Split-Path -Parent $PSCommandPath
          $cert = Join-Path $root 'PageArc-AppPublisher.cer'
          $msix = Join-Path $root 'PageArc_0.9.3.0_x64.msix'
          $c = [Security.Cryptography.X509Certificates.X509Certificate2]::new($cert)
          if (-not (Get-ChildItem Cert:\LocalMachine\TrustedPeople -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $c.Thumbprint)) {
            Import-Certificate $cert -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          }
          Get-AppxPackage -Name KiYouJyo.PageArc | Remove-AppxPackage -ErrorAction SilentlyContinue
          Add-AppxPackage -Path $msix -ForceApplicationShutdown
          Write-Host 'PageArc v0.9.3 installed.' -ForegroundColor Green
          '@ | ForEach-Object { $_ -replace '(?m)^          ', '' } | Set-Content (Join-Path $dir 'Install.ps1') -Encoding utf8

          Set-Content (Join-Path $dir 'Install.cmd') -Value @(
            '@echo off',
            'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Install.ps1"',
            'if errorlevel 1 pause'
          ) -Encoding ascii

          @(
            'PageArc v0.9.3 x64',
            "Build: $env:GITHUB_SHA",
            "Signer: CN=AppPublisher / $env:CERT_THUMBPRINT",
            "MSIX SHA-256: $env:MSIX_SHA256",
            'Validated: Release tests/build, package signing, signature verification, MSIX install/version check, and packaged launch smoke test.',
            'Install: extract the ZIP and run Install.cmd; Windows may request administrator permission to trust the included publisher certificate.'
          ) | Set-Content (Join-Path $dir 'RELEASE.txt') -Encoding utf8

          $zip = Join-Path $env:RELEASE_ROOT 'PageArc-v0.9.3-x64.zip'
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zip -CompressionLevel Optimal -Force

          $checksums = Join-Path $env:RELEASE_ROOT 'SHA256SUMS.txt'
          @(
            "$env:MSIX_SHA256  PageArc_0.9.3.0_x64.msix",
            "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())  PageArc-v0.9.3-x64.zip",
            "$((Get-FileHash $env:CERTIFICATE_PATH -Algorithm SHA256).Hash.ToLowerInvariant())  PageArc-AppPublisher.cer"
          ) | Set-Content $checksums -Encoding ascii

          $notes = Join-Path $env:RELEASE_ROOT 'release-notes.md'
          @'
          # PageArc v0.9.3

          v0.9.3 completes the current PageArc desktop reader convergence on top of the v0.9 functional baseline.

          ## Highlights
          - Multi-tab title-bar shell with Home/library tabs and independent live Reader tabs for multiple books.
          - Figma-converged Library Grid/List behavior and responsive card geometry.
          - Reader sidebars and surrounding chrome now reveal the shared Mica backdrop while the document page keeps its selected reading theme.
          - New Reader view modes: vertical, horizontal and wrapped reading; single/odd/even spreads; zoom, automatic sizing, fit-width and fit-height.
          - Horizontal/wrapped reading supports mouse-wheel and reading-surface page turning without hijacking links, inputs or active selections.
          - Selection notes now autosave without Save/Close buttons and use one muted-red note mark.
          - Existing EPUB / FB2 / MOBI / AZW3 / LIT reading, Windows integration and provider-aware conversion matrix remain intact.

          ## Validation
          The release workflow reruns Release tests/build, signs the x64 MSIX with the configured `CN=AppPublisher` certificate, verifies the signature, installs the package, checks version `0.9.3.0`, and performs a packaged launch smoke test before publishing.

          ## Installation
          Download `PageArc-v0.9.3-x64.zip`, extract it, and run `Install.cmd`. The archive includes the signed MSIX and publisher certificate.

          DRM removal is intentionally out of scope. Original ebook files are never modified.
          '@ | ForEach-Object { $_ -replace '(?m)^          ', '' } | Set-Content $notes -Encoding utf8

          "RELEASE_ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CHECKSUMS_PATH=$checksums" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NOTES_PATH=$notes" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v0.9.3 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'v0.9.3 release already exists; leaving it unchanged.'
            exit 0
          }

          gh release create v0.9.3 `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title 'PageArc v0.9.3' `
            --notes-file "$env:RELEASE_NOTES_PATH" `
            --latest `
            "$env:MSIX_PATH" `
            "$env:CERTIFICATE_PATH" `
            "$env:RELEASE_ZIP" `
            "$env:CHECKSUMS_PATH"
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed: $LASTEXITCODE" }
