name: Vendor pinned Kindle runtime

on:
  push:
    branches: [ agent/v0.3-kindle-flow ]
    paths: [ '.github/workflows/vendor-foliate.yml' ]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.3-kindle-flow
          fetch-depth: 0

      - name: Download exact pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          PIN=78914aef4466eb960965702401634c2cb348e9b1
          mkdir -p ThirdParty/foliate-js/vendor
          curl -fsSL "https://raw.githubusercontent.com/johnfactotum/foliate-js/${PIN}/mobi.js" -o ThirdParty/foliate-js/mobi.js
          curl -fsSL "https://raw.githubusercontent.com/johnfactotum/foliate-js/${PIN}/vendor/fflate.js" -o ThirdParty/foliate-js/vendor/fflate.js

      - name: Verify Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          MOBI_SHA=$(git hash-object ThirdParty/foliate-js/mobi.js)
          FFLATE_SHA=$(git hash-object ThirdParty/foliate-js/vendor/fflate.js)
          test "$MOBI_SHA" = "20c77a83db677cc01a0549bc8dad073ab7e9f030"
          test "$FFLATE_SHA" = "fab2b3ee006a57d4a705be3a5b9e0e9cdeae7ea0"

      - name: Commit vendored runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ThirdParty/foliate-js/mobi.js ThirdParty/foliate-js/vendor/fflate.js
          if git diff --cached --quiet; then
            echo "Pinned runtime already present."
            exit 0
          fi
          git commit -m "chore: vendor pinned foliate Kindle runtime"
          git push origin HEAD:agent/v0.3-kindle-flow
